[workspace]
resolver = "2"
members = [
    "crates/lime-protocol",
    "crates/lime-core",
]
exclude = ["tools/pinyin-eval"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.78"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
