name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bunx --yes ajv-cli@5 validate -s schemas/config.schema.json -d schemas/config.defaults.json
      - run: bunx --yes ajv-cli@5 validate -s schemas/ipc.schema.json -d schemas/ipc.request.example.json --spec=draft2020
      - run: bunx --yes ajv-cli@5 validate -s schemas/ipc.schema.json -d schemas/ipc.response.example.json --spec=draft2020
      - run: bunx --yes ajv-cli@5 validate -s schemas/errors.json -d schemas/errors.catalog.json --spec=draft2020
