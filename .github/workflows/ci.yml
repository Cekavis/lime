name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo check -p lime-ipc -p lime-service
      - run: cargo clippy -p lime-protocol -p lime-ipc -p lime-core -p lime-service --all-targets -- -D warnings
      - run: cargo test --workspace

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bunx --yes ajv-cli@5 validate -s contracts/config.schema.json -d contracts/config.defaults.json --spec=draft2020
      - run: bunx --yes ajv-cli@5 validate -s contracts/ipc.schema.json -d contracts/ipc.request.example.json --spec=draft2020
      - run: bunx --yes ajv-cli@5 validate -s contracts/ipc.schema.json -d contracts/ipc.response.example.json --spec=draft2020
      - run: bunx --yes ajv-cli@5 validate -s contracts/ipc.schema.json -d contracts/ipc.management.request.example.json --spec=draft2020
      - run: bunx --yes ajv-cli@5 validate -s contracts/ipc.schema.json -d contracts/ipc.management.response.example.json --spec=draft2020
      - run: bunx --yes ajv-cli@5 validate -s contracts/ipc.schema.json -d contracts/ipc.benchmark.request.example.json --spec=draft2020
      - run: bunx --yes ajv-cli@5 validate -s contracts/ipc.schema.json -d contracts/ipc.benchmark.response.example.json --spec=draft2020
      - run: bunx --yes ajv-cli@5 validate -s contracts/persistence.schema.json -d contracts/config.persisted.example.json --spec=draft2020
      - run: bunx --yes ajv-cli@5 validate -s contracts/persistence.schema.json -d contracts/model-presets.persisted.example.json --spec=draft2020
      - run: bunx --yes ajv-cli@5 validate -s contracts/errors.json -d contracts/errors.catalog.json --spec=draft2020

  management:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/lime-management/package-lock.json
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci --prefix crates/lime-management
      - run: npm run build --prefix crates/lime-management
      - run: node --test crates/lime-management/src/ui/benchmark.test.mjs
      - uses: dtolnay/rust-toolchain@stable
      - name: Provide release resource placeholders for Tauri check
        run: |
          mkdir -p out/windows-x64/staging/app/rime out/windows-x64/staging/app/llama out/windows-x64/staging/app/licenses
          touch out/windows-x64/staging/app/lime-service.exe out/windows-x64/staging/app/lime-tsf.dll
      - run: cargo check --manifest-path crates/lime-management/src-tauri/Cargo.toml --locked
